      name: mmphysicalinventoryupload
      target-path: resources/
    - artifacts:
      - mmzpurchasepricevariance.zip
      name: mmzpurchasepricevariance
      target-path: resources/
    - artifacts:
      - mmpoposting.zip
      name: mmpoposting
      target-path: resources/
    - artifacts:
      - mmpurinfomasterlist.zip
      name: mmpurinfomasterlist
      target-path: resources/
    - artifacts:
      - mmzprworkflow.zip
      name: mmzprworkflow
      target-path: resources/
    - artifacts:
      - mmmasspostofscrap.zip
      name: mmmasspostofscrap
      target-path: resources/
    - artifacts:
